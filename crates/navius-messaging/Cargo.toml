[package]
name = "navius-messaging"
version = "0.1.0"
edition = "2021"
description = "Messaging abstraction layer for the Navius framework"
repository = "https://github.com/navius/navius"
license = "Apache-2.0"

[dependencies]
navius-core = { path = "../navius-core", version = "0.1.0" }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.31"
tokio = { version = "1.44.1", features = ["sync", "time"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
rand = "0.9.0"

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
mockall = "0.13.1"
tempfile = "3.19.1"
rand = "0.9.0"

[[example]]
name = "simple_publisher"
path = "examples/simple_publisher.rs"

[[example]]
name = "simple_subscriber"
path = "examples/simple_subscriber.rs"

[[example]]
name = "publisher_subscriber"
path = "examples/publisher_subscriber.rs" 