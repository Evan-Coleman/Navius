[package]
name = "navius-auth-entra"
version = "0.1.0"
edition = "2024"
description = "Microsoft Entra (formerly Azure AD) authentication provider for the Navius framework"
license = "Apache-2.0"

[dependencies]
navius-auth = { path = "../navius-auth" }
async-trait = "0.1.88"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
futures = "0.3.31"
jsonwebtoken = "9.3.1"
lru = "0.13.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
url = "2.5.4"

[dev-dependencies]
mockito = "1.7.0"
tokio = { version = "1.44.1", features = ["full", "test-util"] } 