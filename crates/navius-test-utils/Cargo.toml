[package]
name = "navius-test-utils"
version = "0.1.0"
edition = "2024"
description = "Test utilities for Navius framework"
license = "Apache-2.0"
repository = "https://github.com/Evan-Coleman/Navius"
readme = "README.md"

[dependencies]
# Core dependencies from workspace
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# Test-specific dependencies
mockall = "0.13.1"
test-context = "0.4.1"
fake = { version = "4.2.0", features = ["derive"] }
assert_matches = "1.5.0"
proptest = "1.6.0"

# Internal dependencies
navius-core = { path = "../navius-core", version = "0.1.0" } 