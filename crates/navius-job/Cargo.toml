[package]
name = "navius-job"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Background job processing interfaces for the Navius framework"
repository = "https://github.com/navius/navius"
readme = "README.md"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4.40", features = ["serde"] }
cron = "0.15.0"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
navius-event = { path = "../navius-event" }
navius-core = { path = "../navius-core" }
num_cpus = { workspace = true }

[dev-dependencies]
tokio-test = "0.4.4"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[[example]]
name = "basic_jobs"
path = "examples/basic_jobs.rs"

[[example]]
name = "scheduled_jobs"
path = "examples/scheduled_jobs.rs" 