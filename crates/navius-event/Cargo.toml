[package]
name = "navius-event"
version = "0.1.0"
edition = "2021"
description = "Event handling and notification system for the Navius framework"
repository = "https://github.com/navius/navius"
license = "MIT OR Apache-2.0"

[dependencies]
navius-core = { path = "../navius-core" }
navius-plugin = { path = "../navius-plugin" }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.31"
tokio = { version = "1.44.1", features = ["rt", "macros", "sync"] }
dashmap = "6.1.0"
parking_lot = "0.12.3"
uuid = { version = "1.16.0", features = ["v4"] }
once_cell = "1.21.3"

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full", "test-util"] }
mockall = "0.13.1"
futures-util = "0.3.31" 