[package]
name = "navius-db-postgres"
version = "0.1.0"
edition = "2024"
authors = ["Evan Coleman"]
description = "PostgreSQL implementation for the Navius database framework"
license = "Apache-2.0"
repository = "https://github.com/Evan-Coleman/Navius"
readme = "README.md"
keywords = ["database", "postgres", "sqlx", "orm", "navius"]
categories = ["database"]

[dependencies]
# Core dependencies
navius-db = { path = "../navius-db", version = "0.1.0" }
navius-core = { path = "../navius-core", version = "0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# PostgreSQL-specific dependencies
sqlx = { workspace = true, features = ["postgres", "uuid", "chrono", "json", "macros"] } 