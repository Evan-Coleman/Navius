[package]
name = "navius-cache"
version = "0.1.0"
edition = "2024"
description = "Caching functionality for the Navius framework"
repository = "https://github.com/navius/navius"
license = "Apache-2.0"

[dependencies]
navius-core = { path = "../../crates/navius-core" }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.31"
tokio = { version = "1.44.1", features = ["rt", "macros"] }

# Metrics and observability
metrics = { version = "0.24.1", optional = true }

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
mockall = "0.13.1"
metrics-exporter-prometheus = "0.16.2"
metrics-util = "0.19.0"
uuid = { version = "1.16.0", features = ["v4"] }

[features]
default = ["metrics"]
metrics = ["dep:metrics"]

[[example]]
name = "metrics"
required-features = ["metrics"]
path = "examples/metrics.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "metrics_usage"
required-features = ["metrics"]
path = "examples/metrics_usage.rs"

[[example]]
name = "repository_pattern"
path = "examples/repository_pattern.rs"
