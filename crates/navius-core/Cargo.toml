# Cargo.toml for navius-core crate
# This would be placed at crates/navius-core/Cargo.toml

[package]
name = "navius-core"
version = "0.1.0"
edition = "2024"
description = "Core utilities and abstractions for the Navius framework"
license = "Apache-2.0"
repository = "https://github.com/navius/navius"

# Dependencies section with explicit versions
[dependencies]
# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# Added regex dependency
regex = "1.11.1"
redis = { workspace = true, optional = true }
# Config with TOML support only
config = { workspace = true, optional = true, features = ["toml"] }
dotenvy = "0.15.7"

# Time handling
chrono = { workspace = true }

# External
futures = { workspace = true }

# Internal - Ensure all path dependencies linked to features are optional
# Remove non-existent navius-config dependency
# navius-config = { path = "../navius-config", optional = true }
# Remove navius-di dependency from navius-core
# navius-di = { path = "../navius-di", optional = true }
# Remove non-existent navius-logging dependency
# navius-logging = { path = "../navius-logging", optional = true }
# Remove navius-db dependency from navius-core
# navius-db = { path = "../navius-db", optional = true }
# Remove navius-cache dependency from navius-core
# navius-cache = { path = "../navius-cache", optional = true }
# navius-plugin = { path = "../navius-plugin", optional = true }

sqlx = { workspace = true, optional = true }

# Development dependencies
[dev-dependencies]
mockito = "1.7.0"
proptest = "1.6.0"
fake = { version = "4.2.0", features = ["derive", "chrono", "uuid"] }
test-context = "0.4.1"
assert_matches = "1.5.0"
once_cell = "1.21.3"
mockall = "0.13.1"
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "rt-multi-thread",
] }
axum = { workspace = true }
http = { workspace = true }

# The core crate has minimal feature flags
[features]
# Default features
default = [
    "config",
    # "di", # Remove di from default
    # "logging", # Remove logging from default
    "tokio",
    "tracing",
    # "db", # Remove db from default
    # "cache", # Remove cache from default
    # "plugin", # Remove plugin from default
]

# Feature flags
config = ["dep:config"]
# Remove di feature definition
# di = ["dep:navius-di"]
# Remove logging feature definition
# logging = ["dep:tracing", "dep:navius-logging"]
tokio = ["dep:tokio"]
tracing = ["dep:tracing"]
# Remove db feature definition
# db = ["dep:sqlx", "dep:navius-db"]
# Remove cache feature definition
# cache = ["dep:redis", "dep:navius-cache"]
# Remove plugin feature definition
# plugin = ["dep:navius-plugin"]
