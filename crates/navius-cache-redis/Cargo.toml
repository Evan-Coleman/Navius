[package]
name = "navius-cache-redis"
version = "0.1.0"
edition = "2021"
description = "Redis implementation for the Navius cache framework"
repository = "https://github.com/navius/navius"
license = "MIT OR Apache-2.0"

[dependencies]
navius-core = { path = "../navius-core" }
navius-cache = { path = "../navius-cache" }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.31"
tokio = { version = "1.44.1", features = ["rt", "macros"] }
redis = { version = "0.29.2", features = ["tokio-comp", "aio", "connection-manager"] }

# Optional dependencies
metrics = { version = "0.24.1", optional = true }

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
mockall = "0.13.1"
metrics-exporter-prometheus = "0.16.2"
metrics-util = "0.19.0"
uuid = { version = "1.16.0", features = ["v4"] }

[features]
default = []
metrics = ["dep:metrics", "navius-cache/metrics"]

[[example]]
name = "basic_redis"
path = "examples/basic_redis.rs"

[[example]]
name = "redis_with_metrics"
required-features = ["metrics"]
path = "examples/redis_with_metrics.rs" 