[package]
name = "navius-cache-redis"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Redis cache implementation for Navius"
authors = ["Navius Team <maintainers@navius.org>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
navius-cache = { path = "../navius-cache" }
async-trait = "0.1.88"
redis = { version = "0.29.2", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rmp-serde = "1.3.0"
metrics = "0.24.1"
thiserror = "2.0.12"
bb8-redis = "0.21.0"
bb8 = "0.9.0"
rand = "0.9.0"

[features]
default = ["metrics"]
metrics = []

[dev-dependencies]
anyhow = "1.0.97"
tokio = { version = "1.44.1", features = ["full", "test-util"] }
tempfile = "3.19.1"
criterion = { version = "0.5.1", features = ["async_tokio"] }
metrics-exporter-prometheus = "0.16.2"
metrics-util = "0.19.0"
serde = { version = "1.0.219", features = ["derive"] }

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "serialization"
path = "examples/serialization.rs"

[[example]]
name = "connection_pooling"
path = "examples/connection_pooling.rs"

[[example]]
name = "metrics"
path = "examples/metrics.rs"
