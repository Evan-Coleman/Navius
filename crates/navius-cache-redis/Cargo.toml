[package]
name = "navius-cache-redis"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Redis cache implementation for Navius"
authors = ["Navius Team <maintainers@navius.org>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
navius-cache = { path = "../navius-cache" }
async-trait = "0.1.88"
redis = { version = "0.29.2", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
], optional = true }
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rmp-serde = { version = "1.3.0", optional = true }
metrics = { version = "0.24.1", optional = true }
thiserror = "2.0.12"
bb8-redis = { version = "0.21.0", optional = true }
bb8 = { version = "0.9.0", optional = true }
rand = { version = "0.9.0", optional = true }

[features]
default = ["full"]
metrics = ["dep:metrics", "navius-cache/metrics"]
full = ["redis", "msgpack", "metrics"]
redis = ["dep:redis", "dep:bb8-redis", "dep:bb8"]
msgpack = ["dep:rmp-serde"]
rand = ["dep:rand"]

[dev-dependencies]
anyhow = "1.0.97"
tokio = { version = "1.44.1", features = ["full", "test-util"] }
tempfile = "3.19.1"
criterion = { version = "0.5.1", features = ["async_tokio"] }
metrics-exporter-prometheus = "0.16.2"
metrics-util = "0.19.0"
serde = { version = "1.0.219", features = ["derive"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["full"]

[[example]]
name = "serialization"
path = "examples/serialization.rs"
required-features = ["full"]

[[example]]
name = "connection_pooling"
path = "examples/connection_pooling.rs"
required-features = ["full"]

[[example]]
name = "metrics"
path = "examples/metrics.rs"
required-features = ["full", "metrics"]
