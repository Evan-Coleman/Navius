[package]
name = "navius-cache-redis-plugin"
version = "0.1.0"
edition = "2024"
description = "Redis plugin for the Navius caching system using redis-rs"
license = "Apache-2.0"

[dependencies]
navius-core = { path = "../navius-core" }
navius-cache = { path = "../navius-cache" }
navius-plugin = { path = "../navius-plugin" }
redis = { version = "0.29.2", features = [
    "tokio-comp",
    "connection-manager",
    "ahash",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
futures = "0.3.31"
sha1_smol = "1.0.0"

[features]
default = ["basic"]
basic = []
cluster = ["redis/cluster-async"]
json = ["redis/json"]
pubsub = []
tls-rustls = ["redis/tls-rustls"]
tls-native = ["redis/tls-native-tls"]

[dev-dependencies]
tokio-test = "0.4.4"
anyhow = "1.0.97"
rstest = "0.25.0"
rand = "0.9.0"
axum = "0.8.3"
tower = "0.5.2"
tracing-subscriber = "0.3.19"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "advanced_configuration"
path = "examples/advanced_configuration.rs"

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"

[[example]]
name = "axum_integration"
path = "examples/axum_integration.rs"
required-features = ["basic"]
