[package]
name = "navius-plugin"
version = "0.1.0"
edition = "2021"
description = "Plugin system and component registry for the Navius framework"
repository = "https://github.com/navius/navius"
license = "MIT OR Apache-2.0"

[dependencies]
navius-core = { path = "../navius-core" }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.41"
futures = "0.3.31"
tokio = { version = "1.44.1", features = ["rt", "macros"] }
once_cell = "1.21.3"
dashmap = "6.1.0"
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
mockall = "0.13.1" 