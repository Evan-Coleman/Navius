[package]
name = "navius-http"
version = "0.1.0"
edition = "2024"
description = "HTTP server and client functionality for the Navius framework"
license = "Apache-2.0"
repository = "https://github.com/Evan-Coleman/Navius"
readme = "README.md"

# Dependencies section uses workspace inheritance
[dependencies]
# Core dependencies from workspace
navius-core = { path = "../navius-core" }
navius-plugin = { path = "../navius-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
async-trait = "0.1.88"
thiserror = "2.0.12"

# HTTP specific dependencies
axum = "0.8.3"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
reqwest = { version = "0.12.15", features = ["json"] }
bytes = "1.10.1"
futures = "0.3.31"
futures-util = "0.3.31"
http = "1.3.1"
inventory = "0.3.20"

# Development dependencies
[dev-dependencies]
mockito = "1.7.0"
wiremock = "0.6.3"
fake = { version = "4.3.0", features = ["derive", "chrono", "uuid"] }
test-context = "0.4.1"
assert_matches = "1.5.0"
once_cell = "1.21.3"
axum = { workspace = true }
http = { workspace = true }
navius-test = { path = "../navius-test" }
tracing-subscriber = { workspace = true }

# Feature flags
[features]
default = ["server", "client"]
server = []
client = []
test-utils = []
