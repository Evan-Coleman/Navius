[package]
name = "navius-db"
version = "0.1.0"
edition = "2024"
authors = ["Evan Coleman"]
description = "Database functionality for the Navius framework"
license = "Apache-2.0"
repository = "https://github.com/Evan-Coleman/Navius"
readme = "README.md"
keywords = ["database", "postgres", "sqlx", "orm", "navius"]
categories = ["database"]

[dependencies]
# Core dependencies
navius-core = { path = "../navius-core", version = "0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Database-specific dependencies
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"], optional = true }

[features]
default = ["postgres"]
postgres = ["sqlx"]
