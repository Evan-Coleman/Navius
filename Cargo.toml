# Navius workspace Cargo.toml
# Converted from feature flags to workspace approach

[workspace]
resolver = "2"
members = [
    "crates/*",
    ".",        # Include the root example project
]

# Add workspace package metadata
[workspace.package]
version = "0.1.0"
edition = "2021"                                    # Use 2021 for compatibility if some crates are older
authors = ["Navius Team <placeholder@example.com>"] # Placeholder
license = "Apache-2.0"                              # Or MIT OR Apache-2.0 if mixed
repository = "https://github.com/navius/navius"     # Placeholder repo
documentation = "https://docs.rs/navius"            # Placeholder docs

# Add workspace dependencies table
[workspace.dependencies]
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "fmt",
    "json",
] } # Add tracing-subscriber
axum = "0.8.3"
http = "1.3.1"
sqlx = "0.8.3"
redis = "0.29.2"
config = "0.15.11"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
async-trait = "0.1.88"
tower = "0.5.2"
tower-http = "0.6.2"
chrono = { version = "0.4.40", features = ["serde"] }
# Add tokio-test for dev-dependencies
tokio-test = "0.4.4"
# Add num_cpus
num_cpus = "1.16.0"
# Add assert_matches
assert_matches = "1.5.0"
# Add fake
fake = { version = "4.2.0", features = ["derive", "chrono", "uuid"] }
# Add mockito
mockito = "1.7.0"
# Add mockall
mockall = "0.13.1"
# Add proptest
proptest = "1.6.0"
# Add test-context
test-context = "0.4.1"

# Root package definition (navius-example)
[package]
name = "navius-example"
# Inherit from workspace package metadata
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
publish = false

# Root dependencies - inherit from workspace
[dependencies]
# --- Navius Crates ---
navius-core = { path = "crates/navius-core" }
# navius-config = { path = "crates/navius-config" } # Does not exist
navius-di = { path = "crates/navius-di" }
# navius-logging = { path = "crates/navius-logging" } # TBD
navius-auth = { path = "crates/navius-auth" }
navius-db = { path = "crates/navius-db" }
navius-http = { path = "crates/navius-http" }
navius-macros = { path = "crates/navius-macros" }
navius-plugin = { path = "crates/navius-plugin" }

# --- Web & Server ---
axum = { workspace = true, features = ["macros"] } # Inherit, add features
tokio = { workspace = true } # Inherit
tower = { workspace = true } # Inherit
tower-http = { workspace = true, features = [
    "fs",
    "trace",
    "cors",
    "request-id",
    "timeout",
] } # Inherit, add features
http = { workspace = true } # Inherit

# --- Database ---
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
] } # Inherit, add features

# --- Serialization & Config ---
serde = { workspace = true } # Inherit
serde_json = { workspace = true } # Inherit
config = { workspace = true, features = [
    "toml",
    "yaml",
] } # Inherit, add features

# --- Async & Utilities ---
async-trait = { workspace = true } # Inherit
uuid = { workspace = true }        # Inherit
chrono = { workspace = true }      # Inherit

# --- Tracing & Logging ---
tracing = { workspace = true }            # Inherit
tracing-subscriber = { workspace = true } # Inherit tracing-subscriber

[build-dependencies]
# ...

[dev-dependencies]
# ...
