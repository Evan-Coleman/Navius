# Navius workspace Cargo.toml
# Converted from feature flags to workspace approach

[workspace]
members = [
    "crates/*",
    "examples/*",
    "src",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Navius Team"]
license = "Apache-2.0"
repository = "https://github.com/navius/navius"
documentation = "https://docs.navius.io"
readme = "README.md"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }

# Web framework
axum = "0.8.3"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.2", features = ["trace", "cors", "compression-br", "compression-gzip", "timeout", "limit"] }

# Database
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Cache
redis = { version = "0.29.2", features = ["tokio-comp", "connection-manager"] }

# Configuration
config = "0.15.11"
dotenvy = "0.15.7"

# Testing
tokio-test = "0.4.4"
mockall = "0.13.1"
proptest = "1.6.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
