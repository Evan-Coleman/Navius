# Navius workspace Cargo.toml
# Converted from feature flags to workspace approach

[workspace]
members = [
    "crates/*",
    "examples/*",
    "src",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Navius Contributors"]
license = "Apache-2.0"
repository = "https://github.com/navius/navius"
documentation = "https://docs.navius.io"
readme = "README.md"

[workspace.dependencies]
# Core crates
navius-core = { path = "crates/navius-core" }
navius-http = { path = "crates/navius-http" }
navius-auth = { path = "crates/navius-auth" }
navius-auth-entra = { path = "crates/navius-auth-entra" }
navius-db = { path = "crates/navius-db" }
navius-db-postgres = { path = "crates/navius-db-postgres" }
navius-cache = { path = "crates/navius-cache" }
navius-cache-redis = { path = "crates/navius-cache-redis" }
navius-di = { path = "crates/navius-di" }
navius-plugin = { path = "crates/navius-plugin" }
navius-event = { path = "crates/navius-event" }
navius-job = { path = "crates/navius-job" }
navius-messaging = { path = "crates/navius-messaging" }
navius-metrics = { path = "crates/navius-metrics" }
navius-metrics-prometheus = { path = "crates/navius-metrics-prometheus" }
navius-test = { path = "crates/navius-test" }
navius-test-utils = { path = "crates/navius-test-utils" }
navius-template = { path = "crates/navius-template" }
navius-cli = { path = "crates/navius-cli" }

# External dependencies
tokio = { version = "1.44.1", features = ["full"] }
axum = "0.8.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
