# Navius workspace Cargo.toml
# Converted from feature flags to workspace approach

[workspace]
resolver = "3"
members = ["crates/*"]

[package]
name = "navius-example"
version = "0.1.0"
edition = "2024"
authors = ["Navius Team"]
license = "Apache-2.0"
description = "Example application using Navius crates"
repository = "https://github.com/navius/navius"

[dependencies]
# Navius crates
navius-core = { path = "crates/navius-core" }
navius-plugin = { path = "crates/navius-plugin" }
navius-http = { path = "crates/navius-http", features = ["server"] }
navius-di = { path = "crates/navius-di" }
navius-auth = { path = "crates/navius-auth", features = ["jwt"] }
navius-db = { path = "crates/navius-db", features = ["postgres"] }

# Core dependencies
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
chrono = { version = "0.4.40", features = ["serde"] }
base64 = "0.22.1"
toml = "0.8.10"
serde_yaml = "0.9"
config = "0.15.11"

# Web framework
axum = "0.8.3"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.2", features = [
    "trace",
    "cors",
    "compression-br",
    "compression-gzip",
    "timeout",
    "limit",
] }

# Database
sqlx = { version = "0.8.3", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Testing
tempfile = "3.10.1"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Navius Team"]
license = "Apache-2.0"
repository = "https://github.com/navius/navius"
documentation = "https://docs.navius.io"
readme = "README.md"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
bytes = "1.10.1"
futures = "0.3.31"
futures-util = "0.3.31"
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }

# Web framework
axum = "0.8.3"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.2", features = [
    "trace",
    "cors",
    "compression-br",
    "compression-gzip",
    "timeout",
    "limit",
] }

# Database
sqlx = { version = "0.8.3", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Cache
redis = { version = "0.29.2", features = ["tokio-comp", "connection-manager"] }

# Configuration
dotenvy = "0.15.7"

# Testing
tokio-test = "0.4.4"
mockall = "0.13.1"
proptest = "1.6.0"
assert_matches = "1.5.0"
fake = { version = "4.2.0", features = ["derive"] }
mock-it = "0.9.0"
mockito = "1.7.0"
test-context = "0.4.1"

num_cpus = "1.16.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
