[package]
name = "api-inventory"
version = "0.1.0"
edition = "2021"
authors = ["Navius Team"]
description = "Tool to generate an inventory of public APIs across the Navius workspace"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.4.7", features = ["derive"] }
walkdir = "2.4.0"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
chrono = "0.4.31"
toml = "0.8.2"
anyhow = "1.0.75"
regex = "1.10.2"
syntect = "5.1.0"
thiserror = "1.0.50"
syn = { version = "2.0.38", features = ["full", "extra-traits", "visit"] }
proc-macro2 = "1.0.69"
quote = "1.0.33"
itertools = "0.11.0"
termcolor = "1.3.0"
rayon = "1.8.0"

[dev-dependencies]
tempfile = "3.8.1"
rstest = "0.18.2"

[[bin]]
name = "api-inventory"
path = "src/main.rs" 