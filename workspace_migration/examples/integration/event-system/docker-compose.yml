version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"  # Using 5433 to avoid conflicts with other examples
    environment:
      POSTGRES_USER: navius
      POSTGRES_PASSWORD: navius_password
      POSTGRES_DB: navius_events
    volumes:
      - postgres_events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navius"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_events_data: 