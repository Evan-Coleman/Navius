version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: full-stack-postgres
    environment:
      POSTGRES_USER: navius
      POSTGRES_PASSWORD: navius_password
      POSTGRES_DB: navius_fullstack
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navius"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: full-stack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Simulated email service (using Mailhog for development)
  mailhog:
    image: mailhog/mailhog
    container_name: full-stack-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    
  # Monitoring with Prometheus and Grafana
  prometheus:
    image: prom/prometheus
    container_name: full-stack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./data/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    image: grafana/grafana
    container_name: full-stack-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./data/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

networks:
  default:
    name: navius-fullstack-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data: 