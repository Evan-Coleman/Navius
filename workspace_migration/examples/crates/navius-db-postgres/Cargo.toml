[dependencies]
navius-db = { path = "../navius-db" }
navius-core = { path = "../navius-core" }
async-trait = "0.1.88"
sqlx = { version = "0.7.4", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.35", features = ["serde"] }
crypto-hash = "0.3.4"
regex = "1.10.4"

[dev-dependencies]
anyhow = "1.0.97"
tokio-test = "0.4.4"
tempfile = "3.19.1" 