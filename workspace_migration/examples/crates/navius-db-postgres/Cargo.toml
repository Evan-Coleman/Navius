[package]
name = "navius-db-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
navius-db = { path = "../navius-db" }
navius-core = { path = "../navius-core" }
async-trait = "0.1.88"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.40", features = ["serde"] }
crypto-hash = "0.3.4"
regex = "1.11.1"

[dev-dependencies]
anyhow = "1.0.97"
tokio-test = "0.4.4"
tempfile = "3.19.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
criterion = { version = "0.5.1", features = ["html_reports", "async_tokio"] }

[lib]
bench = false

[[example]]
name = "migration_example"
path = "examples/migration_example.rs"

[[example]]
name = "provider_example"
path = "examples/provider_example.rs"

[[bench]]
name = "provider_benchmark"
harness = false 