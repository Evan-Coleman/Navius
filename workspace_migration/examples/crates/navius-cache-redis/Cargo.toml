[package]
name = "navius-cache-redis"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
navius-cache = { path = "../navius-cache" }
navius-core = { path = "../navius-core" }
async-trait = "0.1.88"
redis = { version = "0.29.2", features = ["tokio-rustls-comp", "connection-manager", "script", "aio", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3.31"
rand = "0.9.0"

[dev-dependencies]
anyhow = "1.0.97"
tokio = { version = "1.44.1", features = ["full", "test-util"] }
tempfile = "3.19.1"
criterion = { version = "0.5.1", features = ["async_tokio"] }
bincode = "2.0.1"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "serialization"
path = "examples/serialization.rs"

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"

[[example]]
name = "lua_scripting"
path = "examples/lua_scripting.rs"

[[example]]
name = "connection_pooling"
path = "examples/connection_pooling.rs"

[[bench]]
name = "redis_operations"
harness = false 