[package]
name = "navius-cache"
version = "0.1.0"
edition = "2021"
description = "Cache abstraction layer for Navius framework"
authors = ["Navius Team <info@navius.io>"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bincode = "2.0.1"
async-trait = "0.1.88"
thiserror = "2.0.12"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
humantime-serde = "1.1.1"

[dev-dependencies]
tokio-test = "0.4.4" 