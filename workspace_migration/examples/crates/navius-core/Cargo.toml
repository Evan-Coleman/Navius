# Cargo.toml for navius-core crate
# This would be placed at crates/navius-core/Cargo.toml

[package]
name = "navius-core"
version = "0.1.0"
edition = "2024"
description = "Core functionality for the Navius framework"
license = "Apache-2.0"

# Dependencies section uses workspace inheritance
[dependencies]
# Core dependencies from workspace
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
uuid = { workspace = true }
async-trait = { workspace = true }
thiserror = "2.0.12"

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# Time handling
chrono = { workspace = true }

# Development dependencies
[dev-dependencies]
mockito = { workspace = true }
proptest = { workspace = true }
fake = { workspace = true }
test-context = { workspace = true }
assert_matches = { workspace = true }
once_cell = { workspace = true }
mockall = { workspace = true }

# The core crate has minimal feature flags
[features]
default = []
test-utils = [] # Enable test utilities when testing 