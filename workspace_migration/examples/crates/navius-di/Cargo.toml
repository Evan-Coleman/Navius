[package]
name = "navius-di"
version = "0.1.0"
edition = "2024"
description = "Dependency Injection for Navius applications"
license = "Apache-2.0"

[dependencies]
# Core dependencies
navius-core = { path = "../navius-core" }
async-trait = "0.1.88"
thiserror = "2.0.12"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
tokio-test = "0.4.4"
mockall = "0.13.1" 