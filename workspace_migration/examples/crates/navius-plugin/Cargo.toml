[package]
name = "navius-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Plugin system for the Navius framework"
repository = "https://github.com/navius/navius"
readme = "README.md"

[dependencies]
async-trait = "0.1.56"
chrono = { version = "0.4.22", features = ["serde"] }
libloading = "0.7.3"
serde = { version = "1.0.143", features = ["derive"] }
serde_json = "1.0.83"
semver = "1.0.13"
thiserror = "1.0.32"
tokio = { version = "1.21.0", features = ["full"] }
tracing = "0.1.36"

[dev-dependencies]
tokio-test = "0.4.2"
tracing-subscriber = { version = "0.3.15", features = ["env-filter"] }

[[example]]
name = "simple_plugin"
path = "examples/simple_plugin.rs"

[[example]]
name = "plugin_loading"
path = "examples/plugin_loading.rs"

[[example]]
name = "plugin_capabilities"
path = "examples/plugin_capabilities.rs" 