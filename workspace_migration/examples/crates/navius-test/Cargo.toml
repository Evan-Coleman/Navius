[package]
name = "navius-test"
version = "0.1.0"
edition = "2024"
description = "Testing infrastructure for the Navius framework"
license = "Apache-2.0"
repository = "https://github.com/navius/navius"

[dependencies]
# Core dependencies
async-trait = "0.1.88"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
tracing = "0.1.41"

# For testing utilities
mockall = "0.13.1"
tempfile = "3.19.1"
futures = "0.3.31"
once_cell = "1.21.3"

# Internal dependencies - these will be uncommented later
# navius-core = { path = "../navius-core" }

[dev-dependencies]
tokio-test = "0.4.4"
tracing-subscriber = "0.3.19"
assert_matches = "1.5.0"
