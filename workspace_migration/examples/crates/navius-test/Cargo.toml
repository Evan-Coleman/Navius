[package]
name = "navius-test"
version = "0.1.0"
edition = "2024"
description = "Testing utilities for the Navius application"
license = "MIT"

[dependencies]
# Standard library extensions
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
thiserror = "2.0.12"
anyhow = "1.0.97"
chrono = { version = "0.4.40", features = ["serde"] }
rand = "0.9.0"

# Async utilities
tokio = { version = "1.44.1", features = ["full"] }
async-trait = "0.1.88"
futures = "0.3.31"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Testing
criterion = { version = "0.5.1", optional = true }
tempfile = "3.19.1"
mockall = "0.13.1"
regex = "1.11.1"

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
default = []
bench = ["criterion"]
