# Default configuration for Navius application
# This file contains the default configuration values that will be used
# unless overridden by environment-specific files or environment variables

# Application metadata
app_name = "zero-boilerplate-app"
log_level = "info"

# HTTP server configuration
[http]
host = "127.0.0.1"
port = 3000
cors_allowed_origins = ["http://localhost:3000"]
request_timeout_secs = 30

# Authentication configuration
[auth]
enabled = false
provider = "entra"

[auth.entra]
tenant_id = ""
client_id = ""
client_secret = ""
issuer = ""
jwks_uri = ""

# Database configuration
[database]
enabled = false
url = "postgresql://postgres:postgres@localhost:5432/navius"
max_connections = 10
min_connections = 5

# Cache configuration
[cache]
enabled = false
url = "redis://localhost:6379/0"
ttl_seconds = 3600

# Date formatting configuration
[date_formats]
simple = "%m/%d/%Y"
formal = "%B %d, %Y"
verbose = "%Y-%m-%dT%H:%M:%S%.3fZ"

# Metrics configuration
[metrics]
enabled = false
endpoint = "/actuator/metrics"
prometheus_endpoint = "/actuator/prometheus"

# Feature flags
[features]
web = true
auth = false
database = false
cache = false
metrics = false
events = false
plugins = true
