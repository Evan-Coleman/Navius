[package]
name = "navius-basic-example"
version = "0.1.0"
edition = "2024"
description = "Basic example application using Navius crates"
publish = false

[dependencies]
navius-core = { path = "../../crates/navius-core" }
navius-http = { path = "../../crates/navius-http" }
navius-auth = { path = "../../crates/navius-auth" }
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
async-trait = "0.1.88" 