[package]
name = "navius-event-system-example"
version = "0.1.0"
edition = "2024"
description = "Event system example application using Navius crates"
publish = false

[dependencies]
navius-core = { path = "../../crates/navius-core" }
navius-http = { path = "../../crates/navius-http" }
navius-db = { path = "../../crates/navius-db" }
navius-db-postgres = { path = "../../crates/navius-db-postgres" }
navius-event = { path = "../../crates/navius-event" }
navius-plugin = { path = "../../crates/navius-plugin" }
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rand = "0.9.0" 