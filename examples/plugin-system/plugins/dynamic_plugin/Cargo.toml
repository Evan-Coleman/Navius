[package]
name = "dynamic-plugin"
version = "0.1.0"
edition = "2024"
description = "Dynamic Plugin Example for Navius"
authors = ["Navius Team"]
repository = "https://github.com/navius/navius"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "dynamic_plugin"

[dependencies]
# Navius core crates
navius-core = { path = "../../../../crates/navius-core" }
navius-plugin = { path = "../../../../crates/navius-plugin" }

# External dependencies
async-trait = "0.1.88"
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio-test = "0.4.4"
mockall = "0.13.1" 